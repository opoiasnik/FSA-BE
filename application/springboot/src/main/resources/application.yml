spring:
  application:
    name: property-rental

  datasource:
    url: jdbc:postgresql://localhost:5432/rental_db
    username: rental_user
    password: rental_password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    mapping-resources:
      - persistence/rental-orm.xml

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 200MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: info.rentarea@gmail.com
    password: ${MAIL_PASSWORD}
    properties.mail.smtp:
      auth: true
      starttls.enable: true

rental:
  mail:
    from: info.rentarea@gmail.com

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    sk.fsa.rental: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/rental
          jwk-set-uri: http://localhost:8081/realms/rental/protocol/openid-connect/certs
